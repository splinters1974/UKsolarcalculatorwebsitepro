# ── Netlify configuration for UK Solar Calculator Pro ────────────────────────

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Serverless functions ──────────────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"   # required for ES module syntax in pvgis-proxy.js

# ── SPA fallback — all routes served by index.html ───────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(self)"

    # Content-Security-Policy
    # Allows: self, Google Maps JS/Tiles/Fonts, Formspree, PVGIS (direct fallback),
    #         Google Fonts, inline styles (required by Tailwind JIT)
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com;
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://maps.gstatic.com;
      connect-src 'self' https://formspree.io https://re.jrc.ec.europa.eu https://*.googleapis.com;
      worker-src  blob:;
      frame-src   'none';
      object-src  'none';
    """

# ── Long-lived cache for Vite hashed assets ───────────────────────────────────
# Vite appends a content hash to JS/CSS filenames — safe to cache for 1 year
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Local dev server ──────────────────────────────────────────────────────────
[dev]
  command     = "npm run dev"
  port        = 8888          # netlify dev port (proxies to vite on 3000)
  targetPort  = 3000
